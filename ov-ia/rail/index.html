<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneVerify Left Rail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0ed;
    --panel: #ffffff;
    --sunk: #ece5e0;
    --well: #e6ded7;
    --line: #ded4cd;
    --ink: #2a2140;
    --ink-2: #6b5f7d;
    --brand: #3d2758;
    --accent: #9273f4;
    --accent-soft: #ebe5fd;
    --red: #c8382c;
    --green: #3f9b6b;
    --amber: #a76a00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Figtree', system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1320px; margin: 0 auto; padding: 56px 24px 96px; }
  h1 { font-size: 36px; font-weight: 600; letter-spacing: -0.01em; color: var(--brand); }
  section { margin-top: 40px; }
  button { font: inherit; color: inherit; }

  /* ---------- app frame ---------- */
  .app {
    display: grid; grid-template-columns: 248px minmax(0, 1fr);
    height: 820px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02), 0 12px 32px -18px rgba(61,39,88,0.25);
  }

  /* ---------- rail ---------- */
  .rail { display: flex; flex-direction: column; min-height: 0; background: #f2ede9; border-right: 1px solid var(--line); }
  .rail-top { padding: 20px 16px 12px; }
  .logo svg { display: block; }
  .org {
    margin-top: 16px; width: 100%; display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; text-align: left; padding: 7px 12px; border-radius: 10px;
    background: #e3ddd8; border: 1px solid var(--line); cursor: pointer;
  }
  .scroll { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); padding: 18px 10px 6px; }
  .rail button.item, .rail button.child {
    background: none; border: 0; cursor: pointer; width: 100%; text-align: left;
    display: flex; align-items: center; border-radius: 8px;
  }
  .rail button.item { font-size: 15px; padding: 7px 10px; font-weight: 500; }
  .rail button.item .chev { margin-left: auto; color: var(--ink-2); transition: transform 0.2s ease; }
  .rail button.item[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .rail button.child { font-size: 14px; padding: 5px 10px 5px 26px; color: var(--ink-2); }
  .rail button:hover { background: var(--sunk); }
  .rail button[aria-current="page"] { background: var(--accent-soft); color: var(--brand); font-weight: 600; }
  .kids { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.24s ease, opacity 0.18s ease; }
  .kids > div { overflow: hidden; min-height: 0; }
  .kids > div::after { content: ''; display: block; height: 4px; }
  .kids.open { grid-template-rows: 1fr; opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .kids, .rail button.item .chev { transition: none; } }
  .ext { color: var(--ink-2); font-size: 12px; margin-left: 6px; }
  .rail-foot { border-top: 1px solid var(--line); padding: 10px; }
  .me { gap: 10px; }
  .av {
    width: 30px; height: 30px; border-radius: 999px; background: var(--brand); color: #fff;
    font-size: 12px; font-weight: 600; display: grid; place-items: center; flex: none;
  }
  .me small { display: block; font-size: 12px; color: var(--ink-2); line-height: 1.3; font-weight: 400; }
  .me span { line-height: 1.3; }

  /* ---------- page ---------- */
  .page { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .topbar {
    flex: none; display: flex; align-items: center; gap: 10px; min-height: 60px;
    padding: 10px 24px 10px 32px; border-bottom: 1px solid var(--line); background: #faf7f5; font-size: 16px; flex-wrap: wrap;
  }
  .topbar .up { color: var(--ink-2); }
  .topbar .sep { color: var(--line); }
  .topbar b { font-weight: 600; color: var(--brand); }
  .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .body { flex: 1; min-height: 0; overflow: auto; padding: 24px 32px 40px; }
  .body.flush { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .narrow { max-width: 960px; }

  /* ---------- shared controls ---------- */
  .btn {
    font-size: 14px; padding: 6px 14px; border-radius: 999px; white-space: nowrap; cursor: default;
    border: 1px solid #b9aeb8; background: transparent; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn.dark { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.soft { background: #cfc3f7; border-color: #a996ee; color: var(--brand); }
  .btn.muted { background: var(--well); border-color: var(--line); color: var(--ink-2); }
  .count { display: inline-grid; place-items: center; min-width: 16px; height: 16px; border-radius: 99px; background: var(--brand); color: #fff; font-size: 10px; font-weight: 700; padding: 0 4px; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--well); }
  .strip { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; padding: 12px 32px; flex: none; }
  .strip .chip { font-weight: 400; }
  .input {
    height: 38px; border: 1px solid #c9bfc6; border-radius: 6px; background: var(--panel);
    font-size: 14px; color: #a79fae; display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
  }
  .field label { display: block; font-size: 12px; margin-bottom: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px 16px; }
  .well { background: var(--well); border-radius: 10px; padding: 16px 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .h { font-size: 20px; font-weight: 500; color: var(--brand); }
  .dim { color: var(--ink-2); }
  .small { font-size: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .gap { margin-top: 18px; }
  .seg { display: inline-flex; background: var(--well); border-radius: 999px; padding: 4px; gap: 4px; }
  .seg span { font-size: 14px; padding: 5px 16px; border-radius: 999px; }
  .seg span.on { background: var(--brand); color: #fff; font-weight: 600; }
  .under { display: flex; gap: 24px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .under span { padding: 8px 0; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .under span.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--brand); }

  /* ---------- tables ---------- */
  .tscroll { flex: 1; min-height: 0; overflow: auto; background: var(--panel); border-top: 1px solid var(--line); }
  table { border-collapse: collapse; font-size: 13px; width: 100%; }
  th { position: sticky; top: 0; background: #faf7f5; text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 11px 12px; border-bottom: 1px solid var(--sunk); white-space: nowrap; vertical-align: top; }
  .wide table { min-width: 1500px; }
  .cb { width: 14px; height: 14px; border: 1px solid #b9aeb8; border-radius: 3px; display: inline-block; vertical-align: -2px; background: var(--panel); }
  .alert { display: inline-flex; align-items: center; gap: 6px; }
  .alert i { width: 10px; height: 10px; border-radius: 3px; background: var(--red); display: inline-block; }
  .alert.ok i { background: var(--green); }
  .alert.warn i { background: #d9913a; }
  .red { color: var(--red); }
  .amber { color: var(--amber); font-weight: 600; font-size: 12px; }
  .empty { text-align: center; color: var(--ink-2); padding: 28px; font-size: 13px; }
  .pager { font-size: 12px; color: var(--ink-2); padding: 12px 32px; flex: none; background: var(--panel); border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
  .tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tcard th { position: static; }
  .rate { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 5px; border: 1px solid #a996ee; background: var(--accent-soft); margin-right: 4px; }
  .rate b { font-weight: 600; }
  .icons { color: var(--ink-2); text-align: right; letter-spacing: 8px; }
  .icons .del { color: var(--red); }

  /* ---------- report overview ---------- */
  .overview { flex: none; display: grid; grid-template-columns: 220px minmax(0, 1fr); border-top: 1px solid var(--line); }
  .overview .total { padding: 18px 20px; background: var(--bg); }
  .overview .total b { display: block; font-size: 20px; font-weight: 600; color: var(--brand); }
  .overview .alerts { padding: 16px 20px; background: #e4ddf8; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .overview .alerts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ocard { background: var(--panel); border-radius: 8px; padding: 12px 14px; font-size: 13px; }
  .ocard b { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .ocard .bar { height: 5px; background: var(--sunk); border-radius: 3px; margin: 10px 0 8px; overflow: hidden; }
  .ocard .bar i { display: block; height: 100%; }
  .ocard p { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 12px; padding: 2px 0; }
  .sq { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  /* ---------- groups ---------- */
  .md { flex: 1; display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 0; }
  .md-list { border-right: 1px solid var(--line); background: #faf7f5; overflow-y: auto; }
  .md-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--ink-2); padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .plus { width: 20px; height: 20px; border-radius: 5px; border: 0; background: var(--brand); color: #fff; font-size: 14px; line-height: 1; }
  .grp { width: 100%; text-align: left; background: none; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--sunk); }
  .grp b { display: block; font-size: 14px; font-weight: 600; }
  .grp small { font-size: 12px; color: var(--ink-2); }
  .grp:hover { background: var(--sunk); }
  .grp[aria-current="true"] { background: var(--accent-soft); }
  .md-detail { overflow-y: auto; background: var(--bg); }
  .dhead { display: flex; align-items: center; gap: 10px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  .dhead h4 { font-size: 22px; font-weight: 500; color: var(--brand); }
  .dhead .icons { margin-left: auto; }
  .addrow { display: flex; gap: 10px; padding: 12px 24px; border-bottom: 1px solid var(--line); }
  .addrow .input { flex: 1; }
  .member { display: flex; align-items: center; gap: 10px; padding: 10px 24px; background: var(--panel); border-bottom: 1px solid var(--sunk); font-size: 14px; }
  .member .av { width: 24px; height: 24px; font-size: 10px; }
  .member small { margin-left: auto; font-size: 12px; color: var(--ink-2); }

  /* ---------- checker ---------- */
  .credits { display: flex; justify-content: space-between; align-items: center; background: #d7cdc4; border-radius: 8px; padding: 12px 16px; font-size: 15px; }
  .checker { display: grid; grid-template-columns: 200px minmax(0, 1fr); border-radius: 10px; overflow: hidden; background: var(--well); }
  .types { background: #ddd3ca; padding: 14px 0; font-size: 15px; }
  .types .small { padding: 0 16px 8px; }
  .types div { padding: 9px 26px; }
  .types div.on { background: var(--panel); margin: 0 10px; padding-left: 16px; border-left: 2px solid var(--brand); border-radius: 4px; }

  /* ---------- insights ---------- */
  .embed { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 20px 20px; }
  .embed .under { margin: 0 -20px; padding: 0 20px; }
  .pills { display: flex; gap: 8px; margin: 14px 0; }
  .pill { font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .stat b { display: block; font-size: 38px; font-weight: 600; color: var(--brand); text-align: center; padding: 14px 0 8px; }
  .chart { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 150px; margin-top: 10px; }
  .bars i { flex: 1; background: #6a8fe0; border-radius: 2px 2px 0 0; min-height: 2px; }

  /* ---------- integrations ---------- */
  .tiles { display: flex; gap: 10px; flex-wrap: wrap; }
  .tile { width: 132px; height: 96px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; position: relative; cursor: pointer; font-size: 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; }
  .tile.on { border-color: var(--brand); background: #faf8ff; }
  .tile img { width: 30px; height: 30px; border-radius: 6px; }
  .tile .live { position: absolute; top: 8px; right: 8px; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; background: #dcefe3; color: var(--green); }
  .tile .live.soon { background: var(--sunk); color: var(--ink-2); }
  .tile.req { border-style: dashed; color: var(--ink-2); }
  .tile.req .plusbox { width: 30px; height: 30px; border-radius: 6px; background: var(--sunk); display: grid; place-items: center; font-size: 18px; }
  .detail { padding: 20px 22px; }
  .detail .top { display: flex; gap: 14px; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .detail .top img { width: 42px; height: 42px; border-radius: 8px; }
  .detail h4 { font-size: 20px; font-weight: 600; color: var(--brand); }
  .detail p, .detail li { font-size: 14px; }
  .detail ul { margin: 10px 0 0 18px; columns: 2; column-gap: 28px; }
  .detail li { margin-bottom: 6px; break-inside: avoid; }
  .drop { margin-top: 16px; border: 1.5px dashed #b9aeb8; border-radius: 8px; background: var(--bg); text-align: center; padding: 28px; font-size: 14px; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 99px; background: #dcefe3; color: var(--green); margin-top: 6px; }

  /* ---------- account / org ---------- */
  dl.kv { display: grid; grid-template-columns: 180px 1fr; gap: 8px 16px; font-size: 14px; }
  dl.kv dt { font-weight: 600; }
  .brk { display: flex; gap: 22px; flex-wrap: wrap; font-size: 14px; margin-top: 12px; }
  .brk b { font-weight: 600; }
  .brk small { display: block; font-size: 11px; color: var(--ink-2); }
  .progress { height: 10px; border-radius: 99px; background: #bdb3aa; margin-top: 12px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 10%; background: var(--brand); }
  .sel { display: inline-flex; gap: 6px; align-items: center; }

  @media (max-width: 820px) {
    main { padding: 32px 16px 64px; }
    h1 { font-size: 28px; }
    .app { grid-template-columns: minmax(0, 1fr); height: auto; }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 360px; }
    .topbar { padding: 10px 16px; }
    .body { padding: 16px 16px 28px; overflow: visible; }
    .body.flush { display: block; overflow: visible; }
    .tscroll { max-height: 520px; }
    .strip, .pager { padding-left: 16px; padding-right: 16px; }
    .md, .overview, .checker { grid-template-columns: minmax(0, 1fr); }
    .md-list { border-right: 0; border-bottom: 1px solid var(--line); }
    .overview .alerts, .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
    .tcard { overflow-x: auto; }
    .tcard table { min-width: 560px; }
    .detail ul { columns: 1; }
  }

</style>
</head>

  <section>

      <nav class="rail" aria-label="OneVerify">

      return '<div class="narrow"><div class="tiles">' + list.map(function (it, i) {
        return '<button type="button" class="tile' + (i ? '' : ' on') + '" data-i="' + i + '"><span class="live' + (it.live === 'SOON' ? ' soon' : '') + '">' + it.live + '</span><img src="' + LOGOS[it.logo] + '" alt="">' + it.name + '</button>';
      }).join('') + '<div class="tile req"><span class="plusbox">+</span>Request an Integration</div></div>' +
        '<div class="card gap" id="idetail">' + integDetail(list[0]) + '</div></div>';
    },
    after: function (root) {
      root.querySelectorAll('.tile[data-i]').forEach(function (t) {
        t.addEventListener('click', function () {
          root.querySelectorAll('.tile').forEach(function (x) { x.classList.remove('on'); });
          t.classList.add('on');
          root.querySelector('#idetail').innerHTML = integDetail(INTEG[kind][+t.dataset.i]);
        });
      });
    }
  };
}
PAGES['Integrations/ERA Data'] = integPage('ERA Data');
PAGES['Integrations/EHR'] = integPage('EHR');

PAGES['Account'] = {
  body: function () {
    return '<div class="narrow" style="max-width:640px"><p class="h">General</p><dl class="kv gap"><dt>Name</dt><dd>Felix Lau</dd><dt>Email Address</dt><dd>felix@example.com</dd><dt>Password</dt><dd>************</dd><dt>Nirvana Member Since</dt><dd>09/08/2026</dd></dl>' +
      '<p class="small gap">To edit, please contact <a href="#" onclick="return false" style="color:var(--accent)">help@meetnirvana.com</a></p>' +
      '<p class="h" style="margin-top:32px">Security</p><div class="row gap" style="justify-content:space-between;align-items:flex-start"><div><p style="font-size:17px">Multi-Factor Authentication</p><p class="small dim">For enhanced security, we require enabling at least one method.</p></div><button class="btn">Auth App Enabled &#9998;</button></div></div>';
  }
};

var CHEV = '<svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var RAIL = [
  { name: 'Checker' },
  { name: 'Reports', kids: ['General', 'Medicaid', 'Plan Year Resets', 'Overrides', 'Agentic', 'Search'] },
  { name: 'Work Queue', kids: ['Assignment Management', 'My Queue', 'Groups'] },
  { name: 'Insights' },
  { label: 'Settings' },
  { name: 'Organization', kids: ['Details', 'Users'] },
  { name: 'Configurations', kids: ['Payer Mappings', 'Payer Rates', 'Network Status Rules'] },
  { name: 'Integrations', kids: ['ERA Data', 'EHR'] },
  { name: 'Help & Support', ext: true }
];

var rail = document.getElementById('rail');
var foot = document.getElementById('foot');
var page = document.getElementById('page');
var leaves = [];
var sections = [];

function esc(t) { return t.replace(/&/g, '&amp;'); }

function select(btn, crumb, title) {
  leaves.forEach(function (b) { b.removeAttribute('aria-current'); });
  btn.setAttribute('aria-current', 'page');
  var p = PAGES[crumb ? crumb + '/' + title : title] || {};
  var bar = crumb ? '<span class="up">' + esc(crumb) + '</span><span class="sep">/</span>' : '';
  page.innerHTML = '<div class="topbar">' + bar + '<b>' + esc(title) + '</b>' + (p.actions ? '<div class="actions">' + p.actions + '</div>' : '') + '</div>' +
    '<div class="body' + (p.flush ? ' flush' : '') + '">' + (p.body ? p.body() : '') + '</div>';
  if (p.after) p.after(page);
}

function toggle(sec, open) {
  sections.forEach(function (s) {
    var on = s === sec ? open : false;
    s.btn.setAttribute('aria-expanded', on ? 'true' : 'false');
    s.box.classList.toggle('open', on);
  });
}

function leaf(parent, cls, label, onClick) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = cls;
  b.innerHTML = label;
  b.addEventListener('click', onClick);
  parent.appendChild(b);
  leaves.push(b);
  return b;
}

RAIL.forEach(function (item) {
  if (item.label) {
    var l = document.createElement('div');
    l.className = 'label';
    l.textContent = item.label;
    rail.appendChild(l);
    return;
  }
  if (!item.kids) {
    var b = leaf(rail, 'item', esc(item.name) + (item.ext ? '<span class="ext">&#8599;</span>' : ''), function () {
      if (item.ext) return;
      toggle(null, false);
      select(b, '', item.name);
    });
    item.btn = b;
    return;
  }
  var head = document.createElement('button');
  head.type = 'button';
  head.className = 'item';
  head.innerHTML = esc(item.name) + CHEV;
  head.setAttribute('aria-expanded', 'false');
  var box = document.createElement('div');
  box.className = 'kids';
  var inner = document.createElement('div');
  box.appendChild(inner);
  var sec = { btn: head, box: box, first: null };
  head.addEventListener('click', function () {
    var open = head.getAttribute('aria-expanded') !== 'true';
    toggle(sec, open);
    if (open) sec.first.click();
  });
  rail.appendChild(head);
  rail.appendChild(box);
  sections.push(sec);
  item.kids.forEach(function (k, i) {
    var c = leaf(inner, 'child', esc(k), function () { select(c, item.name, k); });
    if (i === 0) sec.first = c;
  });
});

var me = leaf(foot, 'item me', '<span class="av">FL</span><span>Felix Lau<small>Account</small></span>', function () {
  toggle(null, false);
  select(me, '', 'Account');
});
leaf(foot, 'child', 'Log out', function () {});

RAIL[0].btn.click();

</script>
